<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VAULT // MAXIMUM SECURITY</title>
    <style>
        :root { --bg-deep: #030712; --neon-cyan: #06b6d4; --neon-pink: #ec4899; --neon-purple: #8b5cf6; }
        body { background: var(--bg-deep); color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; font-family: monospace; }
        .container { width: 100%; max-width: 480px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--neon-cyan); border-radius: 20px; padding: 24px; box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); }
        .action-btn { background: linear-gradient(135deg, var(--neon-cyan), #0284c7); color: #000; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        input, textarea { width: 100%; background: #000; border: 1px solid var(--neon-cyan); color: var(--neon-cyan); padding: 10px; border-radius: 5px; margin: 5px 0; }
        #app-screen, #step-bio { display: none; }
        .neon-text { color: var(--neon-cyan); text-shadow: 0 0 5px var(--neon-cyan); }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. PIN入力 -->
        <div id="step-pin">
            <h1 class="neon-text">⚡ ENTER PIN</h1>
            <input type="password" id="pin-input" maxlength="4" placeholder="4-Digit PIN">
            <button class="action-btn" onclick="checkPin()">ENTER</button>
        </div>

        <!-- 2. 生体認証シミュレーション -->
        <div id="step-bio">
            <h1 class="neon-text">🧬 BIOMETRIC</h1>
            <p>指紋または顔認証を実行してください</p>
            <button class="action-btn" onclick="authBio()">認証をクリア</button>
        </div>

        <!-- 3. メイン画面 -->
        <div id="app-screen">
            <h1>💎 DEEP VAULT</h1>
            <select id="category" onchange="loadFields()">
                <option value="bank">🏦 銀行口座</option>
                <option value="card">💳 クレカ</option>
            </select>
            <div id="fields"></div>
            <input type="password" id="master-key" placeholder="マスターパスワード">
            <button class="action-btn" onclick="process()">実行</button>
            <textarea id="result" rows="3" readonly></textarea>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        function checkPin() {
            if(document.getElementById('pin-input').value === "1234") {
                document.getElementById('step-pin').style.display = 'none';
                document.getElementById('step-bio').style.display = 'block';
            } else { alert("PINエラー"); }
        }
        function authBio() {
            // ここで生体認証APIを呼び出す（環境により挙動が変わるよ！）
            document.getElementById('step-bio').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        }
        function loadFields() { /* フォーム生成処理... */ }
        function process() { alert("処理実行"); }
    </script>
</body>
</html>
