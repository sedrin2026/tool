<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault // Secure Suite</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* ロック画面 */
        #lock-screen {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            padding: 20px 0;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 16px 0;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid var(--neon-blue);
            background: transparent;
            transition: 0.2s;
        }

        .pin-dot.active {
            background: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-blue);
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .pin-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 20px;
            padding: 16px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .pin-btn:active {
            background: var(--neon-blue);
            color: #0f172a;
        }

        /* メインアプリ画面 */
        #app-screen {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--text-main);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            transition: 0.2s;
            margin-top: 4px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px;
            word-break: break-all;
            font-family: monospace;
            font-size: 13px;
            color: var(--neon-blue);
            max-height: 120px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 6px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ロック画面 -->
        <div id="lock-screen">
            <div class="header">
                <h1>⚡ CYBER VAULT</h1>
                <p>Enter 4-digit PIN to Unlock</p>
            </div>
            <div class="pin-dots">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="pressPin('1')">1</button>
                <button class="pin-btn" onclick="pressPin('2')">2</button>
                <button class="pin-btn" onclick="pressPin('3')">3</button>
                <button class="pin-btn" onclick="pressPin('4')">4</button>
                <button class="pin-btn" onclick="pressPin('5')">5</button>
                <button class="pin-btn" onclick="pressPin('6')">6</button>
                <button class="pin-btn" onclick="pressPin('7')">7</button>
                <button class="pin-btn" onclick="pressPin('8')">8</button>
                <button class="pin-btn" onclick="pressPin('9')">9</button>
                <button class="pin-btn" onclick="clearPin()">C</button>
                <button class="pin-btn" onclick="pressPin('0')">0</button>
                <button class="pin-btn" onclick="deletePin()">⌫</button>
            </div>
            <p id="pin-error" style="color: #f43f5e; font-size: 12px; min-height: 16px;"></p>
        </div>

        <!-- メイン画面 -->
        <div id="app-screen">
            <div class="header" style="margin-bottom: 10px;">
                <h1>🛡️ Secure Vault</h1>
                <p>Category-based Encrypted Storage</p>
            </div>

            <!-- カテゴリ選択タブ -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchCategory('bank', this)">🏦 銀行</button>
                <button class="tab-btn" onclick="switchCategory('card', this)">💳 クレカ</button>
                <button class="tab-btn" onclick="switchCategory('web', this)">🌐 Web/アプリ</button>
            </div>

            <!-- 入力フォームエリア -->
            <div id="form-container" style="display: flex; flex-direction: column; gap: 12px;">
                <!-- 動的に切り替わる -->
            </div>

            <div class="form-group">
                <label>マスターパスワード（暗号化・復号化キー）</label>
                <input type="password" id="master-pass" placeholder="秘密のパスワードを入力">
            </div>

            <button class="action-btn" onclick="encryptData()">🔒 データを暗号化して保存</button>

            <div class="form-group" style="margin-top: 10px;">
                <label>暗号化データ（暗号文をここに貼り付け）</label>
                <textarea id="cipher-input" rows="2" placeholder="U2FsdGVkX1..."></textarea>
            </div>

            <button class="action-btn" style="background: linear-gradient(135deg, #0ea5e9, #0369a1);" onclick="decryptData()">🔓 復号化して中身を見る</button>

            <div class="form-group">
                <label>復号化された中身</label>
                <div id="result-view" class="result-box">ここに復号結果が表示されます</div>
            </div>
        </div>
    </div>

    <!-- CryptoJS (暗号化ライブラリ) -->
    <script src="https://cdnjs.cloudflare.com/ajax5/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        // 初回PINコード（初期値は "1234" に設定。必要なら変更してね）
        const CORRECT_PIN = "1234";
        let enteredPin = "";

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
                if (enteredPin.length === 4) {
                    setTimeout(checkPin, 200);
                }
            }
        }

        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
        }

        function clearPin() {
            enteredPin = "";
            updatePinDots();
        }

        function updatePinDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        function checkPin() {
            if (enteredPin === CORRECT_PIN) {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                loadCategoryFields('bank');
            } else {
                document.getElementById('pin-error').innerText = "PINコードが違います（初期値: 1234）";
                enteredPin = "";
                updatePinDots();
            }
        }

        // カテゴリごとのフォーム定義
        let currentCategory = 'bank';

        const categoryTemplates = {
            bank: `
                <div class="section-title">🏦 銀行口座情報</div>
                <div class="form-group"><label>銀行名</label><input type="text" id="f-bank-name" placeholder="例: みずほ銀行"></div>
                <div class="form-group"><label>支店名</label><input type="text" id="f-branch" placeholder="例: 渋谷支店"></div>
                <div class="form-group"><label>口座種別・番号</label><input type="text" id="f-account" placeholder="例: 普通 1234567"></div>
                <div class="form-group"><label>口座名義（カタカナ）</label><input type="text" id="f-holder" placeholder="例: ヤマダ タロウ"></div>
                <div class="form-group"><label>暗証番号（PIN）</label><input type="password" id="f-pin" placeholder="例: 1234"></div>
            `,
            card: `
                <div class="section-title">💳 クレジットカード情報</div>
                <div class="form-group"><label>カード会社 / ブランド</label><input type="text" id="c-brand" placeholder="例: 三井住友 VISA"></div>
                <div class="form-group"><label>カード番号</label><input type="text" id="c-number" placeholder="例: 4000 0000 0000 0000"></div>
                <div class="form-group"><label>有効期限</label><input type="text" id="c-expire" placeholder="例: 12/28"></div>
                <div class="form-group"><label>名義人 (HOLDER NAME)</label><input type="text" id="c-name" placeholder="例: TARO YAMADA"></div>
                <div class="form-group"><label>セキュリティコード (CVV)</label><input type="password" id="c-cvv" placeholder="例: 123"></div>
            `,
            web: `
                <div class="section-title">🌐 Webアプリ / ログイン情報</div>
                <div class="form-group"><label>サービス名 / アプリ名</label><input type="text" id="w-service" placeholder="例: X (Twitter) / ネット銀行"></div>
                <div class="form-group"><label>ログインID / メールアドレス</label><input type="text" id="w-id" placeholder="例: user@example.com"></div>
                <div class="form-group"><label>登録者名 / ユーザー名</label><input type="text" id="w-username" placeholder="例: 太郎"></div>
                <div class="form-group"><label>パスワード</label><input type="password" id="w-pass" placeholder="例: secretPassword!99"></div>
            `
        };

        function switchCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadCategoryFields(cat);
        }

        function loadCategoryFields(cat) {
            document.getElementById('form-container').innerHTML = categoryTemplates[cat];
        }

        // 暗号化処理
        function encryptData() {
            let dataObj = { category: currentCategory };
            if (currentCategory === 'bank') {
                dataObj.bankName = document.getElementById('f-bank-name').value;
                dataObj.branch = document.getElementById('f-branch').value;
                dataObj.account = document.getElementById('f-account').value;
                dataObj.holder = document.getElementById('f-holder').value;
                dataObj.pin = document.getElementById('f-pin').value;
            } else if (currentCategory === 'card') {
                dataObj.brand = document.getElementById('c-brand').value;
                dataObj.number = document.getElementById('c-number').value;
                dataObj.expire = document.getElementById('c-expire').value;
                dataObj.name = document.getElementById('c-name').value;
                dataObj.cvv = document.getElementById('c-cvv').value;
            } else if (currentCategory === 'web') {
                dataObj.service = document.getElementById('w-service').value;
                dataObj.id = document.getElementById('w-id').value;
                dataObj.username = document.getElementById('w-username').value;
                dataObj.pass = document.getElementById('w-pass').value;
            }

            const pass = document.getElementById('master-pass').value;
            if (!pass) {
                alert("マスターパスワードを入力してください！");
                return;
            }

            const jsonStr = JSON.stringify(dataObj, null, 2);
            const encrypted = CryptoJS.AES.encrypt(jsonStr, pass).toString();
            
            document.getElementById('cipher-input').value = encrypted;
            alert("暗号化が完了しました！この暗号文をコピーして保存してください。");
        }

        // 復号化処理
        function decryptData() {
            const cipherText = document.getElementById('cipher-input').value;
            const pass = document.getElementById('master-pass').value;

            if (!cipherText || !pass) {
                alert("暗号化データとマスターパスワードの両方を入力してください！");
                return;
            }

            try {
                const bytes = CryptoJS.AES.decrypt(cipherText, pass);
                const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
                
                if (!decryptedStr) {
                    throw new Error("復号失敗");
                }

                const dataObj = JSON.parse(decryptedStr);
                let htmlFormatted = `📂 カテゴリ: ${dataObj.category.toUpperCase()}\n`;
                for (let key in dataObj) {
                    if (key !== 'category') {
                        htmlFormatted += `• ${key}: ${dataObj[key]}\n`;
                    }
                }

                document.getElementById('result-view').innerText = htmlFormatted;
            } catch (e) {
                alert("パスワードが違うか、暗号データが壊れています！");
            }
        }
    </script>
</body>
</html>
