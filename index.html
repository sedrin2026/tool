<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VAULT // SECURE SUITE</title>
    <style>
        :root {
            --bg-deep: #030712;
            --neon-cyan: #06b6d4;
            --neon-pink: #ec4899;
            --neon-purple: #8b5cf6;
            --glass-bg: rgba(6, 182, 212, 0.03);
            --glass-border: rgba(6, 182, 212, 0.2);
            --text-main: #e2e8f0;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(to right, rgba(6, 182, 212, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.15), inset 0 0 15px rgba(6, 182, 212, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 11px;
            color: var(--neon-cyan);
            margin-top: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 共通ロック画面系 */
        .lock-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
            padding: 10px 0;
        }

        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 12px 0;
        }

        .pin-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            box-shadow: 0 0 5px var(--neon-cyan);
            transition: 0.2s;
        }

        .pin-dot.active {
            background: var(--neon-cyan);
            box-shadow: 0 0 12px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .pin-btn {
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            font-size: 20px;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 5px rgba(6, 182, 212, 0.1);
        }

        .pin-btn:active {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* 生体認証ステップ画面 */
        #step-bio {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
            padding: 30px 0;
        }

        .bio-icon {
            font-size: 50px;
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { text-shadow: 0 0 10px var(--neon-pink); transform: scale(1); }
            50% { text-shadow: 0 0 25px var(--neon-pink), 0 0 40px var(--neon-pink); transform: scale(1.08); }
            100% { text-shadow: 0 0 10px var(--neon-pink); transform: scale(1); }
        }

        .bio-btn {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
            width: 100%;
        }

        /* メインアプリ画面 */
        #app-screen {
            display: none;
            flex-direction: column;
            gap: 18px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: rgba(6, 182, 212, 0.15);
            color: var(--neon-cyan);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 11px;
            color: var(--neon-cyan);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 11px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.4);
        }

        .action-btn {
            background: linear-gradient(135deg, var(--neon-cyan), #0284c7);
            color: #030712;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            transition: 0.2s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            background: rgba(3, 7, 18, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            padding: 12px;
            word-break: break-all;
            font-family: monospace;
            font-size: 12px;
            color: var(--neon-cyan);
            max-height: 110px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 4px;
            margin-bottom: 10px;
        }

        .settings-link {
            text-align: center;
            margin-top: 10px;
        }

        .settings-link a {
            color: var(--text-muted);
            font-size: 11px;
            text-decoration: none;
            cursor: pointer;
        }

        .settings-link a:hover {
            color: var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ステップ1：4桁PINコード入力画面 -->
        <div id="step-pin" class="lock-container">
            <div class="header">
                <h1>⚡ SECURE VAULT</h1>
                <p id="pin-instruction">Enter 4-Digit PIN Code</p>
            </div>
            <div class="pin-dots">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="pressPin('1')">1</button>
                <button class="pin-btn" onclick="pressPin('2')">2</button>
                <button class="pin-btn" onclick="pressPin('3')">3</button>
                <button class="pin-btn" onclick="pressPin('4')">4</button>
                <button class="pin-btn" onclick="pressPin('5')">5</button>
                <button class="pin-btn" onclick="pressPin('6')">6</button>
                <button class="pin-btn" onclick="pressPin('7')">7</button>
                <button class="pin-btn" onclick="pressPin('8')">8</button>
                <button class="pin-btn" onclick="pressPin('9')">9</button>
                <button class="pin-btn" onclick="clearPin()">C</button>
                <button class="pin-btn" onclick="pressPin('0')">0</button>
                <button class="pin-btn" onclick="deletePin()">⌫</button>
            </div>
            <p id="pin-error" style="color: #ec4899; font-size: 11px; min-height: 14px;"></p>
            <div class="settings-link">
                <a onclick="togglePinChangeMode()">⚙️ PINコードを変更する</a>
            </div>
        </div>

        <!-- ステップ2：二重セキュリティ（生体認証・デバイスロック確認） -->
        <div id="step-bio">
            <div class="header" style="margin-bottom: 0;">
                <h1>🛡️ 2FA SECURITY</h1>
                <p>Biometric / Device Verification</p>
            </div>
            <div class="bio-icon">🧬</div>
            <p style="font-size: 12px; color: var(--text-muted);">最後の砦：スマホの生体認証または画面ロックをクリアしてください。</p>
            <button class="bio-btn" onclick="passBioVerification()">🔓 生体認証 / ロック解除をクリア</button>
        </div>

        <!-- メインアプリ画面 -->
        <div id="app-screen">
            <div class="header" style="margin-bottom: 6px;">
                <h1>💎 DEEP VAULT</h1>
                <p>Encrypted Data Management</p>
            </div>

            <!-- カテゴリタブ -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchCategory('bank', this)">🏦 銀行口座</button>
                <button class="tab-btn" onclick="switchCategory('card', this)">💳 クレカ</button>
                <button class="tab-btn" onclick="switchCategory('web', this)">🌐 アプリ</button>
            </div>

            <!-- 動的フォーム -->
            <div id="form-container" style="display: flex; flex-direction: column; gap: 10px;"></div>

            <div class="form-group">
                <label>マスターパスワード（暗号化キー）</label>
                <input type="password" id="master-pass" placeholder="秘密のマスターキー">
            </div>

            <button class="action-btn" onclick="encryptData()">🔒 暗号化してセーブ</button>

            <div class="form-group" style="margin-top: 4px;">
                <label>暗号化データ（暗号文）</label>
                <textarea id="cipher-input" rows="2" placeholder="U2FsdGVkX1..."></textarea>
            </div>

            <button class="action-btn" style="background: linear-gradient(135deg, var(--neon-purple), #6d28d9); color: #fff;" onclick="decryptData()">🔓 復号化して中身をロード</button>

            <div class="form-group">
                <label>復号結果</label>
                <div id="result-view" class="result-box">ここにデータが表示されます</div>
            </div>
        </div>
    </div>

    <!-- CryptoJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        // PINコードの管理（初期値は "1234"、スマホのlocalStorageに保存）
        if (!localStorage.getItem('user_vault_pin')) {
            localStorage.setItem('user_vault_pin', '1234');
        }

        let enteredPin = "";
        let isChangingPin = false;
        let oldPinBuffer = "";

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updatePinDots();
                if (enteredPin.length === 4) {
                    setTimeout(processPinAction, 200);
                }
            }
        }

        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
        }

        function clearPin() {
            enteredPin = "";
            updatePinDots();
        }

        function updatePinDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < enteredPin.length) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            }
        }

        function processPinAction() {
            const savedPin = localStorage.getItem('user_vault_pin');

            if (!isChangingPin) {
                // 通常のログイン判定
                if (enteredPin === savedPin) {
                    // 1段階目クリア → 2段階目の生体認証画面へ！
                    document.getElementById('step-pin').style.display = 'none';
                    document.getElementById('step-bio').style.display = 'flex';
                } else {
                    document.getElementById('pin-error').innerText = "❌ PINコードが違います";
                    enteredPin = "";
                    updatePinDots();
                }
            } else {
                // PIN変更モード
                if (!oldPinBuffer) {
                    if (enteredPin === savedPin) {
                        oldPinBuffer = enteredPin;
                        enteredPin = "";
                        updatePinDots();
                        document.getElementById('pin-instruction').innerText = "Enter NEW 4-Digit PIN";
                        document.getElementById('pin-error').innerText = "✨ 現在のPINを確認しました。新しいPINを入力";
                    } else {
                        document.getElementById('pin-error').innerText = "❌ 現在のPINが違います";
                        enteredPin = "";
                        updatePinDots();
                    }
                } else {
                    // 新しいPINを保存
                    localStorage.setItem('user_vault_pin', enteredPin);
                    alert("🎉 PINコードが新しく変更されました！");
                    isChangingPin = false;
                    oldPinBuffer = "";
                    enteredPin = "";
                    document.getElementById('pin-instruction').innerText = "Enter 4-Digit PIN Code";
                    document.getElementById('pin-error').innerText = "";
                    updatePinDots();
                }
            }
        }

        function togglePinChangeMode() {
            isChangingPin = true;
            enteredPin = "";
            oldPinBuffer = "";
            updatePinDots();
            document.getElementById('pin-instruction').innerText = "Enter CURRENT PIN";
            document.getElementById('pin-error').innerText = "🔐 現在の4桁を入力してください";
        }

        // 2段階目：生体認証シミュレーション通過
        function passBioVerification() {
            document.getElementById('step-bio').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            loadCategoryFields('bank');
        }

        // カテゴリフォーム管理
        let currentCategory = 'bank';
        const categoryTemplates = {
            bank: `
                <div class="section-title">🏦 銀行口座セキュリティ</div>
                <div class="form-group"><label>銀行名</label><input type="text" id="f-bank-name" placeholder="例: 〇〇銀行"></div>
                <div class="form-group"><label>支店名</label><input type="text" id="f-branch" placeholder="例: 本店・渋谷支店"></div>
                <div class="form-group"><label>口座番号</label><input type="text" id="f-account" placeholder="例: 普通 1234567"></div>
                <div class="form-group"><label>口座名義</label><input type="text" id="f-holder" placeholder="例: ヤマダ タロウ"></div>
                <div class="form-group"><label>暗証番号 (PIN)</label><input type="password" id="f-pin" placeholder="例: 1234"></div>
            `,
            card: `
                <div class="section-title">💳 クレジットカード情報</div>
                <div class="form-group"><label>ブランド / 会社</label><input type="text" id="c-brand" placeholder="例: VISA / Mastercard"></div>
                <div class="form-group"><label>カード番号</label><input type="text" id="c-number" placeholder="例: 4000 0000 0000 0000"></div>
                <div class="form-group"><label>有効期限</label><input type="text" id="c-expire" placeholder="例: 12/28"></div>
                <div class="form-group"><label>名義人</label><input type="text" id="c-name" placeholder="例: TARO YAMADA"></div>
                <div class="form-group"><label>CVV (セキュリティコード)</label><input type="password" id="c-cvv" placeholder="例: 123"></div>
            `,
            web: `
                <div class="section-title">🌐 Webアプリ / ログイン</div>
                <div class="form-group"><label>サービス名</label><input type="text" id="w-service" placeholder="例: ネット銀行 / X / 証券"></div>
                <div class="form-group"><label>ログインID / メアド</label><input type="text" id="w-id" placeholder="例: user@example.com"></div>
                <div class="form-group"><label>登録者名</label><input type="text" id="w-username" placeholder="例: 山田太郎"></div>
                <div class="form-group"><label>パスワード</label><input type="password" id="w-pass" placeholder="例: password!99"></div>
            `
        };

        function switchCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadCategoryFields(cat);
        }

        function loadCategoryFields(cat) {
            document.getElementById('form-container').innerHTML = categoryTemplates[cat];
        }

        // 暗号化
        function encryptData() {
            let dataObj = { category: currentCategory };
            if (currentCategory === 'bank') {
                dataObj.bankName = document.getElementById('f-bank-name').value;
                dataObj.branch = document.getElementById('f-branch').value;
                dataObj.account = document.getElementById('f-account').value;
                dataObj.holder = document.getElementById('f-holder').value;
                dataObj.pin = document.getElementById('f-pin').value;
            } else if (currentCategory === 'card') {
                dataObj.brand = document.getElementById('c-brand').value;
                dataObj.number = document.getElementById('c-number').value;
                dataObj.expire = document.getElementById('c-expire').value;
                dataObj.name = document.getElementById('c-name').value;
                dataObj.cvv = document.getElementById('c-cvv').value;
            } else if (currentCategory === 'web') {
                dataObj.service = document.getElementById('w-service').value;
                dataObj.id = document.getElementById('w-id').value;
                dataObj.username = document.getElementById('w-username').value;
                dataObj.pass = document.getElementById('w-pass').value;
            }

            const pass = document.getElementById('master-pass').value;
            if (!pass) {
                alert("マスターパスワードを入力してください！");
                return;
            }

            const encrypted = CryptoJS.AES.encrypt(JSON.stringify(dataObj), pass).toString();
            document.getElementById('cipher-input').value = encrypted;
            alert("🔒 暗号化に成功しました！");
        }

        // 復号化
        function decryptData() {
            const cipherText = document.getElementById('cipher-input').value;
            const pass = document.getElementById('master-pass').value;

            if (!cipherText || !pass) {
                alert("暗号データとマスターパスワードを入力してください！");
                return;
            }

            try {
                const bytes = CryptoJS.AES.decrypt(cipherText, pass);
                const decryptedStr = bytes.toString(CryptoJS.enc.Utf8);
                if (!decryptedStr) throw new Error();

                const dataObj = JSON.parse(decryptedStr);
                let text = `📂 [${dataObj.category.toUpperCase()}]\n`;
                for (let k in dataObj) {
                    if (k !== 'category') text += `• ${k}: ${dataObj[k]}\n`;
                }
                document.getElementById('result-view').innerText = text;
            } catch (e) {
                alert("❌ パスワード違い、またはデータが不正です！");
            }
        }
    </script>
</body>
</html>
