<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER VAULT // MAXIMUM SECURITY PROTOCOL</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-glass: rgba(15, 23, 42, 0.92);
            --neon-cyan: #22d3ee;
            --neon-pink: #f472b6;
            --neon-purple: #a78bfa;
            --neon-green: #34d399;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-glow: 0 0 25px rgba(34, 211, 238, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(167, 139, 250, 0.12) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--bg-glass);
            border: 2px solid var(--neon-cyan);
            border-radius: 24px;
            padding: 28px;
            box-shadow: var(--border-glow), inset 0 0 20px rgba(34, 211, 238, 0.15);
            backdrop-filter: blur(16px);
        }

        .terminal-header {
            text-align: center;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(34, 211, 238, 0.4);
            padding-bottom: 15px;
        }

        .terminal-header h1 {
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 12px var(--neon-cyan);
            letter-spacing: 3px;
        }

        .terminal-header p {
            font-size: 12px;
            color: var(--neon-cyan);
            margin-top: 6px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* PIN Pad Styles */
        .pin-dots {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin: 25px 0;
        }

        .pin-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            transition: 0.2s;
        }

        .pin-dot.active {
            background: var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .pin-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 280px;
            margin: 0 auto;
        }

        .pin-btn {
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            font-size: 20px;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pin-btn:active {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: scale(0.95);
        }

        #step-bio, #app-screen {
            display: none;
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Biometric Section */
        .bio-box {
            text-align: center;
            padding: 20px 0;
        }

        .bio-icon {
            font-size: 52px;
            margin-bottom: 15px;
            text-shadow: 0 0 25px var(--neon-cyan);
        }

        /* App Main Screen */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--neon-cyan);
            color: var(--text-muted);
            padding: 12px 4px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: rgba(34, 211, 238, 0.25);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
            border-color: var(--neon-cyan);
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        .item-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(34, 211, 238, 0.3);
        }

        .item-selector select {
            background: #020617;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 6px 10px;
            border-radius: 6px;
            font-weight: bold;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 14px;
        }

        label {
            font-size: 12px;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            background: #020617;
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 12px var(--neon-cyan);
            border-color: #fff;
        }

        .action-btn {
            background: linear-gradient(135deg, var(--neon-cyan), #0284c7);
            border: none;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            color: #030712;
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4);
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn.purple {
            background: linear-gradient(135deg, var(--neon-purple), #7c3aed);
            color: #fff;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.4);
        }

        .result-box {
            background: #020617;
            border: 1px solid var(--neon-purple);
            padding: 14px;
            color: #e9d5ff;
            min-height: 80px;
            max-height: 160px;
            overflow-y: auto;
            margin-top: 10px;
            border-radius: 8px;
            font-size: 13px;
            word-break: break-all;
            box-shadow: inset 0 0 12px rgba(167, 139, 250, 0.25);
        }

        .settings-link {
            text-align: center;
            margin-top: 20px;
        }

        .settings-link a {
            color: var(--text-muted);
            font-size: 12px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .settings-link a:hover {
            color: var(--neon-cyan);
            text-shadow: 0 0 6px var(--neon-cyan);
        }

        .msg-alert {
            color: var(--neon-pink);
            font-size: 12px;
            text-align: center;
            margin-top: 10px;
            min-height: 15px;
            text-shadow: 0 0 6px var(--neon-pink);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 1. PINコード認証画面 -->
        <div id="step-pin" class="fade-in">
            <div class="terminal-header">
                <h1 id="pin-title">⚡ ENTER PIN</h1>
                <p>SECURITY LEVEL 1 // ACCESS GATE</p>
            </div>
            <div class="pin-dots">
                <div class="pin-dot" id="dot-0"></div>
                <div class="pin-dot" id="dot-1"></div>
                <div class="pin-dot" id="dot-2"></div>
                <div class="pin-dot" id="dot-3"></div>
            </div>
            <div class="pin-pad">
                <button class="pin-btn" onclick="pressPin('1')">1</button>
                <button class="pin-btn" onclick="pressPin('2')">2</button>
                <button class="pin-btn" onclick="pressPin('3')">3</button>
                <button class="pin-btn" onclick="pressPin('4')">4</button>
                <button class="pin-btn" onclick="pressPin('5')">5</button>
                <button class="pin-btn" onclick="pressPin('6')">6</button>
                <button class="pin-btn" onclick="pressPin('7')">7</button>
                <button class="pin-btn" onclick="pressPin('8')">8</button>
                <button class="pin-btn" onclick="pressPin('9')">9</button>
                <button class="pin-btn" onclick="clearPin()">C</button>
                <button class="pin-btn" onclick="pressPin('0')">0</button>
                <button class="pin-btn" onclick="deletePin()">⌫</button>
            </div>
            <div id="pin-msg" class="msg-alert"></div>
            <div class="settings-link">
                <a onclick="enablePinChange()">⚙️ PINコード変更プロトコル起動</a>
            </div>
        </div>

        <!-- 2. 二重セキュリティ（生体認証画面） -->
        <div id="step-bio" class="fade-in">
            <div class="terminal-header">
                <h1>🧬 BIOMETRIC 2FA</h1>
                <p>SECURITY LEVEL 2 // HARDWARE WALL</p>
            </div>
            <div class="bio-box">
                <div class="bio-icon">🛡️</div>
                <p style="font-size: 13px; color: var(--text-main); margin-bottom: 20px;">
                    デバイスの生体認証またはロック解除を実行してください。
                </p>
                <button class="action-btn" onclick="authBio()">生体認証 / ロック解除をクリア</button>
            </div>
        </div>

        <!-- 3. メインアプリ画面（最大10件対応） -->
        <div id="app-screen" class="fade-in">
            <div class="terminal-header">
                <h1>💎 DEEP VAULT</h1>
                <p>MAXIMUM SECURE STORAGE // 10 SLOTS</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('bank', this)">🏦 銀行口座</button>
                <button class="tab-btn" onclick="switchTab('card', this)">💳 クレカ</button>
                <button class="tab-btn" onclick="switchTab('web', this)">🌐 アプリ</button>
            </div>

            <div class="item-selector">
                <label id="slot-label" style="font-size: 11px;">登録スロット選択</label>
                <select id="slot-select" onchange="changeSlot()">
                    <option value="1">SLOT 01</option>
                    <option value="2">SLOT 02</option>
                    <option value="3">SLOT 03</option>
                    <option value="4">SLOT 04</option>
                    <option value="5">SLOT 05</option>
                    <option value="6">SLOT 06</option>
                    <option value="7">SLOT 07</option>
                    <option value="8">SLOT 08</option>
                    <option value="9">SLOT 09</option>
                    <option value="10">SLOT 10</option>
                </select>
            </div>

            <div id="form-area"></div>

            <div class="form-group" style="margin-top: 15px;">
                <label>マスターパスワード（暗号化キー）</label>
                <input type="password" id="master-pass" placeholder="秘密のマスターキーを入力">
            </div>

            <button class="action-btn" onclick="encryptData()">🔒 データを暗号化して保存</button>

            <div class="form-group" style="margin-top: 15px;">
                <label>暗号化データ（サイファーテキスト）</label>
                <textarea id="cipher-text" rows="2" placeholder="U2FsdGVkX1..."></textarea>
            </div>

            <button class="action-btn purple" onclick="decryptData()">🔓 復号化して中身を見る</button>

            <div class="form-group" style="margin-top: 15px;">
                <label>復号結果ビューア</label>
                <div id="result-view" class="result-box">ここに復号されたデータが表示されます...</div>
            </div>
        </div>
    </div>

    <!-- CryptoJS 暗号化ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script>
        if (!localStorage.getItem('vault_pin')) {
            localStorage.setItem('vault_pin', '1234');
        }

        let enteredPin = "";
        let isChangingPin = false;
        let oldPinBuffer = "";

        function pressPin(num) {
            if (enteredPin.length < 4) {
                enteredPin += num;
                updateDots();
                if (enteredPin.length === 4) {
                    setTimeout(handlePinComplete, 150);
                }
            }
        }

        function deletePin() {
            enteredPin = enteredPin.slice(0, -1);
            updateDots();
        }

        function clearPin() {
            enteredPin = "";
            updateDots();
        }

        function updateDots() {
            for (let i = 0; i < 4; i++) {
                const dot = document.getElementById('dot-' + i);
                dot.className = 'pin-dot ' + (i < enteredPin.length ? 'active' : '');
            }
        }

        function handlePinComplete() {
            const savedPin = localStorage.getItem('vault_pin');
            if (!isChangingPin) {
                if (enteredPin === savedPin) {
                    document.getElementById('step-pin').style.display = 'none';
                    document.getElementById('step-bio').style.display = 'block';
                } else {
                    document.getElementById('pin-msg').innerText = "❌ ACCESS DENIED // PIN ERROR";
                    enteredPin = "";
                    updateDots();
                }
            } else {
                if (!oldPinBuffer) {
                    if (enteredPin === savedPin) {
                        oldPinBuffer = enteredPin;
                        enteredPin = "";
                        updateDots();
                        document.getElementById('pin-title').innerText = "⚡ NEW PIN";
                        document.getElementById('pin-msg').innerText = "✨ 新しい4桁のPINを入力してください";
                    } else {
                        document.getElementById('pin-msg').innerText = "❌ CURRENT PIN ERROR";
                        enteredPin = "";
                        updateDots();
                    }
                } else {
                    localStorage.setItem('vault_pin', enteredPin);
                    alert("🎉 SECURE PROTOCOL: PINコードが正常に変更されました！");
                    isChangingPin = false;
                    oldPinBuffer = "";
                    enteredPin = "";
                    document.getElementById('pin-title').innerText = "⚡ ENTER PIN";
                    document.getElementById('pin-msg').innerText = "";
                    updateDots();
                }
            }
        }

        function enablePinChange() {
            isChangingPin = true;
            enteredPin = "";
            oldPinBuffer = "";
            document.getElementById('pin-title').innerText = "⚡ CURRENT PIN";
            document.getElementById('pin-msg').innerText = "🔐 現在の4桁を入力してください";
            updateDots();
        }

        async function authBio() {
            try {
                if (window.PublicKeyCredential) {
                    await navigator.credentials.get({
                        publicKey: {
                            challenge: new Uint8Array([9, 8, 7, 6, 5, 4, 3, 2, 1]),
                            userVerification: "required"
                        }
                    });
                }
            } catch (e) {
                console.log("Biometric fallback triggered.");
            }

            document.getElementById('step-bio').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            switchTab('bank', document.querySelector('.tab-btn'));
        }

        let currentTab = 'bank';
        let currentSlot = '1';

        const templates = {
            bank: `
                <div class="form-group"><label>銀行名</label><input type="text" id="b-name" placeholder="例: みずほ銀行"></div>
                <div class="form-group"><label>支店名</label><input type="text" id="b-branch" placeholder="例: 渋谷支店"></div>
                <div class="form-group"><label>口座番号</label><input type="text" id="b-account" placeholder="例: 普通 1234567"></div>
                <div class="form-group"><label>口座名義 (カナ)</label><input type="text" id="b-holder" placeholder="例: ヤマダ タロウ"></div>
                <div class="form-group"><label>暗証番号 (PIN)</label><input type="password" id="b-pin" placeholder="例: 1234"></div>
            `,
            card: `
                <div class="form-group"><label>カード会社 / ブランド</label><input type="text" id="c-brand" placeholder="例: 三井住友 VISA"></div>
                <div class="form-group"><label>カード番号</label><input type="text" id="c-num" placeholder="例: 4000 0000 0000 0000"></div>
                <div class="form-group"><label>有効期限</label><input type="text" id="c-exp" placeholder="例: 12/28"></div>
                <div class="form-group"><label>名義人 (HOLDER)</label><input type="text" id="c-name" placeholder="例: TARO YAMADA"></div>
                <div class="form-group"><label>CVV (セキュリティコード)</label><input type="password" id="c-cvv" placeholder="例: 123"></div>
            `,
            web: `
                <div class="form-group"><label>サービス / アプリ名</label><input type="text" id="w-srv" placeholder="例: ネット銀行 / X"></div>
                <div class="form-group"><label>ログインID / メアド</label><input type="text" id="w-id" placeholder="例: user@example.com"></div>
                <div class="form-group"><label>登録者名 / ユーザー名</label><input type="text" id="w-user" placeholder="例: 山田太郎"></div>
                <div class="form-group"><label>パスワード</label><input type="password" id="w-pass" placeholder="例: secretPass!99"></div>
            `
        };

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('form-area').innerHTML = templates[tab];
            loadSavedDataToForm();
        }

        function changeSlot() {
            currentSlot = document.getElementById('slot-select').value;
            loadSavedDataToForm();
        }

        function getStorageKey() {
            return 'vault_' + currentTab + '_slot_' + currentSlot;
        }

        function loadSavedDataToForm() {
            const saved = localStorage.getItem(getStorageKey());
            // フォームを一旦クリア
            const inputs = document.querySelectorAll('#form-area input');
            inputs.forEach(input => input.value = '');
            
            if (saved) {
                try {
                    const obj = JSON.parse(saved);
                    if (currentTab === 'bank') {
                        document.getElementById('b-name').value = obj.bankName || '';
                        document.getElementById('b-branch').value = obj.branch || '';
                        document.getElementById('b-account').value = obj.account || '';
                        document.getElementById('b-holder').value = obj.holder || '';
                        document.getElementById('b-pin').value = obj.pin || '';
                    } else if (currentTab === 'card') {
                        document.getElementById('c-brand').value = obj.brand || '';
                        document.getElementById('c-num').value = obj.number || '';
                        document.getElementById('c-exp').value = obj.expire || '';
                        document.getElementById('c-name').value = obj.name || '';
                        document.getElementById('c-cvv').value = obj.cvv || '';
                    } else if (currentTab === 'web') {
                        document.getElementById('w-srv').value = obj.service || '';
                        document.getElementById('w-id').value = obj.id || '';
                        document.getElementById('w-user').value = obj.username || '';
                        document.getElementById('w-pass').value = obj.pass || '';
                    }
                } catch(e) {}
            }
        }

        function encryptData() {
            let data = { category: currentTab, slot: currentSlot };
            if (currentTab === 'bank') {
                data.bankName = document.getElementById('b-name').value;
                data.branch = document.getElementById('b-branch').value;
                data.account = document.getElementById('b-account').value;
                data.holder = document.getElementById('b-holder').value;
                data.pin = document.getElementById('b-pin').value;
            } else if (currentTab === 'card') {
                data.brand = document.getElementById('c-brand').value;
                data.number = document.getElementById('c-num').value;
                data.expire = document.getElementById('c-exp').value;
                data.name = document.getElementById('c-name').value;
                data.cvv = document.getElementById('c-cvv').value;
            } else if (currentTab === 'web') {
                data.service = document.getElementById('w-srv').value;
                data.id = document.getElementById('w-id').value;
                data.username = document.getElementById('w-user').value;
                data.pass = document.getElementById('w-pass').value;
            }

            const pass = document.getElementById('master-pass').value;
            if (!pass) {
                alert("⚠️ マスターパスワードを入力してください！");
                return;
            }

            // スロットごとに自動保存
            localStorage.setItem(getStorageKey(), JSON.stringify(data));

            const encrypted = CryptoJS.AES.encrypt(JSON.stringify(data), pass).toString();
            document.getElementById('cipher-text').value = encrypted;
            alert(`🔒 [${currentTab.toUpperCase()} - SLOT ${currentSlot}] データを要塞レベルで暗号化・保存しました！`);
        }

        function decryptData() {
            const cipher = document.getElementById('cipher-text').value;
            const pass = document.getElementById('master-pass').value;
            if (!cipher || !pass) {
                alert("⚠️ 暗号データとマスターパスワードの両方が必要です！");
                return;
            }

            try {
                const bytes = CryptoJS.AES.decrypt(cipher, pass);
                const str = bytes.toString(CryptoJS.enc.Utf8);
                if (!str) throw new Error();
                const obj = JSON.parse(str);
                
                let resText = `📂 [VAULT DATA // SLOT ${obj.slot || '?'}]\n`;
                for (let k in obj) {
                    if (k !== 'category' && k !== 'slot') {
                        resText += `• ${k}: ${obj[k]}\n`;
                    }
                }
                document.getElementById('result-view').innerText = resText;
            } catch (e) {
                alert("❌ DECRYPTION FAILED // パスワードが違うかデータが破損しています！");
            }
        }
    </script>
</body>
</html>
